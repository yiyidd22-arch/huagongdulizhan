# 备用方案：Cloudflare 原生 Git 集成已启用时，推送会自动由 Cloudflare 构建部署。
# 若 Git 集成不可用，可取消注释下方 jobs 并配置 GitHub Secrets：
#   CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（yiyi.dd22@gmail.com 账号）

name: Deploy to Cloudflare Pages (fallback)

on:
  workflow_dispatch:

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=gaoyuanhaugong
